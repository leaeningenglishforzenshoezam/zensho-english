<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日のミッション・独立テスト</title>
<style>body{font-family:system-ui,sans-serif;max-width:760px;margin:30px auto;padding:0 16px;background:#f5f7fb;color:#243047}.panel{background:white;border:1px solid #dae1eb;border-radius:16px;padding:20px;margin:16px 0}h1{font-size:1.5rem}.small{color:#59677b;font-size:.87rem}.bar{height:8px;border-radius:8px;background:#e7edf4;overflow:hidden}.bar span{height:100%;display:block;background:#34947c}button{padding:9px 15px;border-radius:9px;border:1px solid #9eabba;background:white;cursor:pointer}select{padding:7px} .mission{padding:14px 0;border-top:1px solid #e6e9ef}</style>
</head><body><h1>今日のミッション｜独立テスト</h1><p class="small">feature/daily-missions 専用。ホーム画面や学習記録は変更しません。星のかけらは付与しません。</p>
<div class="panel"><label>級：<select id="level"><option value="1">1級</option><option value="2">2級</option></select></label> <button id="refresh">ログから再読み込み</button><p id="meta" class="small"></p><div id="cards"></div></div>
<div class="panel"><strong>確認事項</strong><p class="small">進捗は既存の当日学習ログから読み取ります。実際の学習ページを使用した後、「ログから再読み込み」を押してください。同日のミッション候補は固定です。端末の日付と既存ログの日付基準を一致させています。</p><p class="small">注：これは未公開の検証ページです。現時点ではブラウザ上の総合動作テストは未完了です。</p></div>
<script src="learning_categories.js"></script><script src="learning_log.js"></script><script src="daily_mission_rules.js"></script><script src="daily_mission.js"></script>
<script>
(function(){const level=document.getElementById("level");const cards=document.getElementById("cards");const meta=document.getElementById("meta");function render(){const s=window.GoimonDailyMissions?.getStatus(level.value);if(!s){meta.textContent="エンジンを読み込めませんでした";return;}meta.textContent=s.date+" / "+s.level+"級 / "+s.missions.length+"枠 / 現在は採点連携前の仕様テストです。報酬は付与されません。";cards.replaceChildren();s.missions.forEach(m=>{const item=document.createElement("div");item.className="mission";const name=document.createElement("strong");name.textContent=({review:"復習",basic:"基礎",exam:"実戦"}[m.slot]||m.slot)+"｜"+m.label;const detail=document.createElement("p");detail.className="small";detail.textContent=(m.available?(m.goal+" ／ "+(m.category||"")+" ／ 演習単位の判定待ち"):"この級では問題未整備")+" ／ 星のかけら "+m.rewardStars+"個（未付与）";item.append(name,detail);cards.append(item);});}
level.addEventListener("change",render);document.getElementById("refresh").addEventListener("click",render);render();})();
</script></body></html>
