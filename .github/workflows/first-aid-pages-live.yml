name: Verify live GitHub Pages First Aid
on:
  pull_request:
    paths:
      - 'tests/first-aid-pages-live.cjs'
      - '.github/workflows/first-aid-pages-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/first-aid-pages-live.cjs
