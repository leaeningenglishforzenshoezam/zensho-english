name: Grade 2 Q11 checks
on:
  push:
    branches: [feature/grade-2]
  pull_request:
    paths:
      - 'g2q11*'
      - 'learning_categories.js'
      - 'cloud_schema.js'
      - 'goimon.js'
      - 'index.html'
      - 'tests/g2q11.test.cjs'
      - 'tests/g2q11-storage.test.cjs'
      - 'tests/g2q11-recovery.test.cjs'
      - 'tests/g2q11-browser.cjs'
      - 'tests/g2q11-mobile.cjs'
      - 'tests/g2q11-cloud-storage-browser.cjs'
      - '.github/workflows/g2q11-checks.yml'
permissions:
  contents: read
jobs:
  q11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check g2q11.js
          node --check g2q11_reward_recovery.js
          node --check g2q11_questions.js
          node --check goimon.js
          node --check cloud_schema.js
      - name: Grade 2 Q11 contract tests
        run: node --test tests/g2q11.test.cjs tests/g2q11-storage.test.cjs tests/g2q11-recovery.test.cjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: |
          node tests/g2q11-browser.cjs
          node tests/g2q11-mobile.cjs
          node tests/g2q11-cloud-storage-browser.cjs
