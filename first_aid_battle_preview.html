<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>First Aid 戦闘プレビュー｜GOIMON QUEST</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#1c3341;background:#f4f3e9}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:18px 16px 38px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.kicker{color:#487c73;font-weight:900;font-size:.8rem;letter-spacing:.13em}.badge{border:1px solid #81b8a8;border-radius:99px;padding:5px 10px;font-size:.73rem;background:#e2f2eb}
h1{font-size:clamp(1.55rem,5vw,2.5rem);margin:4px 0 10px}p{line-height:1.55}
.notice{padding:12px 14px;background:#e8efe6;border-radius:12px;font-size:.9rem;margin:10px 0}
.panel{background:white;border:2px solid #233c49;border-radius:18px;padding:18px;box-shadow:5px 5px 0 #dee4d9;margin:16px 0}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}select,button{font:inherit}
select{border:1px solid #80999e;border-radius:10px;background:white;padding:9px}
button{border:1.5px solid #264c5a;background:#fff;border-radius:12px;padding:13px 16px;color:#18313b;font-weight:700;min-height:46px;cursor:pointer}
button.primary{background:#237e72;color:white;border-color:#237e72}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid #d5842b;outline-offset:3px}
.combat{min-height:160px;background:linear-gradient(#dcefe9,#edf2df);border:2px solid #a3c9bb;border-radius:16px;padding:14px;display:flex;align-items:flex-end;justify-content:space-around;gap:16px}
.fighter{text-align:center;flex:1;font-weight:800}.fighter .avatar{font-size:clamp(46px,10vw,76px);line-height:1.3}
.fighter.enemy .avatar{filter:saturate(.8)}.hpbar{background:#d6e1df;border-radius:99px;height:12px;overflow:hidden;margin:6px 0}.hpbar>i{display:block;height:100%;background:#3d9d81;transition:width .25s}.enemy .hpbar>i{background:#c98858}
.stats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.86rem}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions button{min-height:58px}.hint{color:#607279;font-size:.86rem}
#question{border-top:1px solid #dae5e1;margin-top:14px;padding-top:12px}#question h2{font-size:1.15rem}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.choices button{text-align:left;background:#fbfcf8}
.feedback{padding:13px;background:#eef5e8;border:1px solid #bfd7bb;border-radius:12px}
audio{width:100%}#speaker{background:#1d6a76;color:white;width:100%;margin-top:6px}
#speaker[hidden]{display:none}
@media(max-width:500px){.choices{grid-template-columns:1fr}.panel{padding:12px}.actions{grid-template-columns:1fr}.fighter .avatar{font-size:50px}}
</style>
<script src="battle-prototype/catalog.js" defer></script>
<script src="battle-prototype/core.js" defer></script>
<script src="battle-prototype/question_bank.js" defer></script>
<script src="battle-prototype/chapter_questions.js" defer></script>
<script src="battle-prototype/question-routing.js" defer></script>
<script src="battle-prototype/quest_question_audio.js" defer></script>
<script src="words_1kyu.js" defer></script>
<script src="battle-prototype/first_aid_battle_preview.js" defer></script>
</head><body><main class="wrap">
<header><span class="kicker">GOIMON QUEST · TEST BATTLE</span><span class="badge">セーブしないテスト</span></header>
<h1>First Aid 戦闘おためし</h1>
<p class="hint">第1章の戦闘計算エンジンと実際の英単語データを使用。回復SKILLを押して、音声を聞き、日本語の意味を選ぼう。</p>
<div class="notice">このページは戦闘・回復の単独プレビューです。通常のクエスト進行、ゴイモン、所持品、学習記録は変更しません。</div>
<section class="panel"><div class="controls"><label for="stage">出題ステージ：</label><select id="stage">
<option value="1">STAGE 1（単語1～50）</option><option value="2">STAGE 2（51～100）</option>
<option value="3">STAGE 3（101～150）</option><option value="4">STAGE 4（151～200）</option>
<option value="5">STAGE 5（201～300）</option><option value="all">範囲指定なし（全単語）</option>
</select><button id="restart" type="button">戦闘をやり直す</button></div></section>
<section class="panel"><div class="combat">
<div class="fighter"><div class="avatar" aria-hidden="true">🐑</div><div>ラミア（体験用）</div><div class="hpbar"><i id="playerbar"></i></div><div id="playerhp"></div></div>
<div class="fighter enemy"><div class="avatar" aria-hidden="true">🪨</div><div>森の小番人</div><div class="hpbar"><i id="enemybar"></i></div><div id="enemyhp"></div></div>
</div><div class="stats"><span id="turninfo"></span><span id="skillsinfo"></span></div>
<p id="battlelog" class="notice" role="status"></p>
<div id="actions" class="actions"><button id="attack" type="button">通常攻撃（単語4択）</button><button id="aid" type="button" class="primary">First Aid（音声 → 意味）</button></div>
<section id="question" hidden><h2 id="questiontitle">問題</h2><div id="questionbody"></div><div id="audioarea"></div><div id="choices" class="choices"></div></section>
<div id="feedback" class="feedback" hidden></div>
</section>
<p class="hint">※ 実際のクエスト本編では、選択したゴイモンのステータス・装備・残りHP・敵が反映されます。テストではFirst Aidを2回使える状態から始め、HPを少し減らしてあります。</p>
</main></body></html>
