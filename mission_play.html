<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ミッション｜GOIMON</title>
<script src="cloud_schema.js"></script><script src="cloud_storage.js"></script><script src="cloud_config.js"></script>
<script src="battle-prototype/catalog.js"></script><script src="goimon-items/store.js"></script><script src="goimon-items/runtime-entry.js"></script>
<link rel="stylesheet" href="q7.css"><link rel="stylesheet" href="daily-missions/mission_play.css"><script src="daily-missions/daily_mission_rules.js"></script><link rel="stylesheet" href="learning-theme.css">
<link rel="stylesheet" href="daily-missions/mission_bonus.css"></head>
<body class="mission-page"><header class="mission-header"><a href="index.html">← ホーム</a><span>DAILY MISSION</span><a href="quest_home.html">クエスト</a></header>
<section class="mission-hero"><p class="eyebrow">今日の一歩を、相棒の力に。</p><h1>今日のミッション</h1><p>好きな学習から挑戦しよう。</p><p id="balance" class="wallet" aria-live="polite"></p></section>
<section id="dashboard" aria-labelledby="dashboardTitle"><div class="dashboard-heading"><h2 id="dashboardTitle">今日のチャレンジ</h2><label>受験級<select id="missionLevel"><option value="1">1級</option><option value="2">2級</option></select></label><button id="refreshMissions" type="button" class="secondary" disabled>更新</button></div><p id="dailySummary" role="status">達成状況を確認しています…</p><progress id="dailyProgress" value="0" max="6" aria-label="今日のミッション達成数" hidden></progress><div id="missionCards" class="mission-grid"></div><p class="mission-footnote">報酬は各ミッション1日1回。形式を変えても同じ枠の報酬です（日本時間）。</p><p id="basicBonus" class="mission-footnote" hidden></p></section>
<section id="loginBonus" class="login-bonus" hidden><img src="images/gacha/star.png" alt=""><div><strong>ログインボーナス</strong><p id="loginBonusStatus" role="status">ほしのかけら 1個</p></div><button id="claimLoginBonus" disabled>1個受け取る</button></section>
<details id="missionSetup"><summary>形式を選んで始める</summary><label>挑戦する内容<select id="kind"><option value="words:enja">単語 英→日</option><option value="words:jaen">単語 日→英</option><option value="words:audio">単語 音声</option><option value="idioms:meaning">熟語 意味</option><option value="idioms:synonym">熟語 同義表現</option><option value="exam:mix">大問9</option><option value="exam:standard">大問11</option><option value="listening">リスニング</option><option value="reading">読解・会話</option><option value="reorder">語句整序</option></select></label>
<p id="notice">採点後に学習記録・育成・ほしのかけらを保存します。</p><button id="start" disabled>ミッションを始める</button></details><p id="status" role="status" aria-live="polite">準備中…</p><section id="instructions" hidden></section><section id="reviewToolbar" hidden aria-label="復習の表示"><h2>答えを確認しよう</h2><label><input id="wrongOnly" type="checkbox"> 間違えた問題だけ表示</label><p id="reviewStatus" role="status"></p><button id="retryReview" type="button" hidden>解説を再取得</button></section><main id="questions"></main><div class="grading-bar" id="gradingBar" hidden><span id="answered">問題を選んでスタート</span><button id="finish" disabled>採点する</button><button id="backToMissions" type="button" hidden>ミッション一覧へ</button></div><dialog id="resultDialog" aria-labelledby="resultTitle"><div id="resultContent"></div><button id="closeResult">答え・解説を確認</button></dialog><p><a href="index.html">ホームへ戻る</a></p>
<script type="module" src="daily-missions/mission_play.mjs"></script></body></html>
