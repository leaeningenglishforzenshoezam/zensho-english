<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>今日のおすすめ | GOIMON</title>
  <link rel="stylesheet" href="recommended.css" />
</head>
<body>
  <main class="wrap">
    <header class="pageHeader">
      <a class="homeLink" href="index.html">← ホーム</a>
      <span id="levelBadge" class="pill">—</span>
    </header>
    <h1>今日のおすすめ</h1>
    <p class="intro">迷ったら、ここから。</p>

    <section class="recommendation" aria-label="おすすめの学習">
      <img class="guide" src="images/goimon/q10_kraken_child.png" width="1280" height="1280" alt="海賊帽のクラーケン" />
      <p id="guideMessage" class="speech">今日の学習を見つけよう！</p>
      <div class="recommendationBody" aria-live="polite">
        <p class="eyebrow">きょうの学習</p>
        <h2 id="pickInfo">おすすめを読み込み中…</h2>
        <p id="pickReason" class="shortReason">学習記録を確認しています。</p>
      </div>
      <button id="startEnja" class="button primary" type="button" disabled>この学習を始める <span aria-hidden="true">→</span></button>
    </section>

    <details class="disclosure">
      <summary>記録・ほかのおすすめ</summary>
      <div class="detailsBody">
        <div id="pickDetail" class="record">学習記録を確認しています。</div>
        <div class="actionGrid">
          <button id="startJaEn" class="button secondary" type="button" disabled>別の学習</button>
          <button id="goStudy" class="button secondary" type="button" disabled>別の学習</button>
        </div>
      </div>
    </details>

    <details class="disclosure">
      <summary>ゴイモンを育てたいとき</summary>
      <div class="detailsBody">
        <h2 id="growInfo">育成おすすめを読み込み中…</h2>
        <p id="growDetail" class="record">ゴイモンの育ち方を確認しています。</p>
        <button id="startGrow" class="button secondary" type="button" disabled>この育成おすすめを始める</button>
      </div>
    </details>

    <details class="disclosure">
      <summary>おすすめの設定</summary>
      <div class="detailsBody">
        <label for="passLine">正答率の目安（%）</label>
        <p class="hint" id="passLineHelp">高くするほど復習を優先しやすくなります。</p>
        <div class="settingRow">
          <input id="passLine" type="number" min="1" max="100" value="80" aria-describedby="passLineHelp" />
          <button id="reroll" class="button secondary" type="button">もう一度みる</button>
        </div>
      </div>
    </details>

    <footer>
      <a class="progressLink" href="progress.html">ブロック進捗を見る <span aria-hidden="true">→</span></a>
      <details class="navigation">
        <summary>学習ページを選ぶ</summary>
        <nav class="navLinks" aria-label="学習ページ">
        <a href="index.html">ホーム</a>
        <a href="study.html">暗記</a>
        <a href="quiz.html">英→日</a>
        <a href="quiz_jaen.html">日→英</a>
        <a href="audio_quiz.html">音声→意味</a>
        <a href="accent.html">大問1</a>
        <a href="sentence.html">大問9</a>
        <a href="reorder.html">大問12</a>
        <a href="idiom_quiz.html">イディオム</a>
        <a href="paraphrase_quiz.html">大問11</a>
        <a href="list.html">一覧</a>
        <a href="progress.html">進捗</a>
        <a href="recommended.html" class="active">今日のおすすめ</a>
        </nav>
      </details>
    </footer>
  </main>

  <script src="words_1kyu.js"></script>
  <script src="blocks_1kyu.js"></script>
  <script>
    window.ACTIVE_LEVEL = localStorage.getItem("zensho_level_v1") || "1";
    if (window.ACTIVE_LEVEL === "1") {
      window.WORDS = window.WORDS_1KYU || [];
      window.BLOCKS = window.BLOCKS_1KYU || [];
    }
  </script>

  <script src="words_2kyu.js"></script>
  <script src="blocks_2kyu.js"></script>
  <script>
    if (window.ACTIVE_LEVEL === "2") {
      window.WORDS = window.WORDS_2KYU || [];
      window.BLOCKS = window.BLOCKS_2KYU || [];
    }
  </script>

<script src="learning_categories.js"></script>
<script src="learning_log.js"></script>

<script src="goimon.js"></script>
<script src="recommended.js"></script>
</body>
</html>
