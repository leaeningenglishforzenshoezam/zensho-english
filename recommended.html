<!DOCTYPE html>
<html lang="ja">
<head>
<script src="cloud_schema.js"></script>
<script src="cloud_storage.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今日のおすすめ | GOIMON</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f7fb; color: #172b45; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; line-height: 1.65; }
    .wrap { max-width: 720px; margin: auto; padding: 24px 18px 40px; }
    a { color: #285baf; text-underline-offset: 4px; }
    .nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; margin-bottom: 24px; }
    .nav a { text-decoration: none; padding: 8px 0; }
    .badge { font-size: 12px; font-weight: 700; color: #465d7c; background: #e7edf5; padding: 5px 12px; border-radius: 20px; }
    h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: .02em; }
    .intro { font-size: 14px; color: #5a6c83; margin: 0 0 22px; }
    .card { padding: 24px; border: 1px solid #dce4ef; border-radius: 20px; background: #fff; margin-bottom: 16px; }
    .primary-card { border-top: 4px solid #3269cc; box-shadow: 0 8px 24px #24456e08; }
    .eyebrow { color: #3563a7; font-size: 12px; font-weight: 700; margin: 0 0 10px; }
    h2 { font-size: 24px; line-height: 1.45; margin: 0 0 14px; overflow-wrap: anywhere; }
    .facts { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 0 0 14px; font-size: 14px; }
    .facts div { display: flex; flex-wrap: wrap; gap: 8px; }
    dt { color: #5a6c83; } dd { margin: 0; font-weight: 700; }
    .reason { color: #52647b; font-size: 14px; line-height: 1.75; margin: 0 0 20px; }
    button { font: inherit; cursor: pointer; min-height: 46px; border-radius: 12px; padding: 11px 16px; border: 1px solid #d6dfec; background: #fff; color: #284e81; font-weight: 700; }
    button:disabled { cursor: default; opacity: .5; }
    button:hover:not(:disabled) { filter: brightness(.96); }
    :focus-visible { outline: 3px solid #db940d; outline-offset: 4px; }
    .start { width: 100%; background: #285fc2; color: #fff; border-color: #285fc2; font-size: 16px; min-height: 52px; }
    .alternatives { border-top: 1px solid #e7edf5; margin-top: 20px; padding-top: 16px; }
    .alternatives p { color: #63738a; font-size: 12px; margin: 0 0 9px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .actions button { font-size: 14px; background: #f8fafd; overflow-wrap: anywhere; }
    .growth { background: #fffdf6; border-color: #e9e1cc; }
    .growth .eyebrow { color: #7a612b; }
    .growth h2 { font-size: 18px; margin-bottom: 8px; }
    .growth .reason { margin-bottom: 14px; }
    .growth button { background: #fff; border-color: #ddcfaa; color: #725522; width: 100%; font-size: 14px; }
    .settings { padding: 0 4px; color: #52647b; font-size: 14px; }
    summary { cursor: pointer; padding: 12px 0; font-weight: 700; }
    .settings-body { padding: 4px 0 16px; }
    .setting-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    input { width: 76px; padding: 9px; border: 1px solid #bac8da; border-radius: 8px; font: inherit; color: #172b45; background: #fff; }
    .note { font-size: 12px; margin: 10px 0 14px; line-height: 1.75; }
    footer { border-top: 1px solid #dce4ef; margin-top: 18px; padding-top: 18px; display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
    @media (max-width: 480px) {
      .wrap { padding: 12px 16px 28px; }
      .nav { margin-bottom: 14px; }
      h1 { font-size: 23px; }
      .intro { margin-bottom: 16px; font-size: 13px; }
      .card { padding: 20px 18px; border-radius: 16px; }
      h2 { font-size: 22px; }
      .facts { gap: 6px 14px; font-size: 13px; }
      .actions { gap: 8px; }
      .actions button { padding: 10px 8px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <nav class="nav" aria-label="ページ移動">
      <a href="index.html">← ホーム</a>
      <span id="levelBadge" class="badge">全商英検</span>
    </nav>
    <header>
      <h1>今日のおすすめ</h1>
      <p class="intro">学習記録から、今のあなたに合う学習を。</p>
    </header>
    <section class="card primary-card" aria-labelledby="pickInfo">
      <p class="eyebrow">まずはこれから</p>
      <div aria-live="polite">
        <h2 id="pickInfo">おすすめを読み込み中…</h2>
        <dl class="facts">
          <div><dt>範囲</dt><dd id="pickRange">—</dd></div>
          <div><dt id="pickRecordLabel">記録</dt><dd id="pickRecord">—</dd></div>
        </dl>
        <p id="pickDetail" class="reason"></p>
      </div>
      <button id="startEnja" class="start" type="button" disabled>学習を始める</button>
      <div class="alternatives">
        <p>ほかの学習にするなら</p>
        <div class="actions">
          <button id="startJaEn" type="button" disabled>候補を読み込み中…</button>
          <button id="goStudy" type="button" disabled>候補を読み込み中…</button>
        </div>
      </div>
    </section>
    <section class="card growth" aria-labelledby="growInfo">
      <p class="eyebrow">ゴイモン育成から選ぶ</p>
      <div aria-live="polite">
        <h2 id="growInfo">育成おすすめを読み込み中…</h2>
        <p id="growDetail" class="reason"></p>
      </div>
      <button id="startGrow" type="button" disabled>この学習で育てる</button>
    </section>
    <details class="settings">
      <summary>おすすめの設定・補足</summary>
      <div class="settings-body">
        <div class="setting-row">
          <label for="passLine">復習の目安となる正答率</label>
          <span><input id="passLine" type="number" min="1" max="100" step="1" value="80" aria-describedby="passLineNote"> %</span>
        </div>
        <p id="passLineNote" class="note">目安を上げるほど復習を優先します。合格や定着を保証する数値ではありません。</p>
        <button id="reroll" type="button">別のおすすめを見る</button>
        <p class="note">学習を始めたばかりの間は、基本の学習を順におすすめします。育成おすすめは、ゴイモンの能力をもとに選びます。</p>
      </div>
    </details>
    <footer>
      <a href="progress.html">学習の進捗を見る</a>
      <a href="index.html">学習メニューへ</a>
    </footer>
  </main>
  <script src="words_1kyu.js"></script>
  <script src="blocks_1kyu.js"></script>
  <script>
    window.ACTIVE_LEVEL = GOIMONStorage.getItem("zensho_level_v1") || "1";
    if (window.ACTIVE_LEVEL === "1") {
      window.WORDS = window.WORDS_1KYU || [];
      window.BLOCKS = window.BLOCKS_1KYU || [];
    }
  </script>

  <script src="words_2kyu.js"></script>
  <script src="blocks_2kyu.js"></script>
  <script>
    if (window.ACTIVE_LEVEL === "2") {
      window.WORDS = window.WORDS_2KYU || [];
      window.BLOCKS = window.BLOCKS_2KYU || [];
    }
  </script>

<script src="learning_categories.js"></script>
<script src="learning_log.js"></script>

<script src="goimon.js"></script>
<script src="recommended.js"></script>
</body>
</html>
