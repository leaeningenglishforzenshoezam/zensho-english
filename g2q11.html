<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="cloud_schema.js"></script><script src="cloud_storage.js"></script>
<script src="cloud_config.js"></script><link rel="stylesheet" href="cloud_auto.css"><script src="cloud_autosave.js" defer></script><script src="cloud_auto.js" defer></script><link rel="stylesheet" href="cloud_navigation.css"><script src="cloud_navigation.js" defer></script>
<title>全商英検2級 大問11｜GOIMON</title><link rel="stylesheet" href="g2q11.css"><script src="study-time.js" defer></script>
</head>
<body><div class="wrap">
<header class="top"><div><span class="eyebrow">GOIMON · GRAMMAR TRAINING</span><h1>全商英検2級 <span>大問11</span></h1><p>文法・語法の3択演習</p></div></header>
<main>
<section class="card setup" id="setup"><div class="section-head"><div><span class="eyebrow">QUESTION SETUP</span><h2>問題を選ぶ</h2></div><span class="pill">SET 1〜4 · 全200問</span></div>
<p class="muted">1級の演習ページと同じように、出題範囲・順番・問題数を設定できます。</p>
<div class="shortcut-grid"><button id="openQuestions" class="shortcut">☷ 問題一覧 <span>200問を確認・選択</span></button><button id="openGrammar" class="shortcut">▦ 文法一覧 <span>文法別にすべて解く</span></button></div>
<div class="field-grid"><label>出題範囲 <select id="category"><option value="all">全範囲（200問）</option></select></label>
<label>出題順 <select id="order"><option value="sequential">番号順</option><option value="continue">前回の続きから</option><option value="random">ランダム</option><option value="weak">苦手優先（誤答回数順）</option></select></label>
<label>問題数 <select id="count"><option value="5">5問（本番形式）</option><option value="10">10問</option><option value="20">20問</option><option value="50">50問</option><option value="100">100問</option><option value="150">150問</option><option value="200">全200問</option></select></label>
</div><div class="number-range"><label>開始番号 <input id="numberStart" type="number" min="1" max="200" value="1" inputmode="numeric"></label><label>終了番号 <input id="numberEnd" type="number" min="1" max="200" value="200" inputmode="numeric"></label></div><p class="muted">開始番号・終了番号で出題範囲を指定できます（例：51～100）。</p><p id="poolInfo" class="muted"></p><div class="setup-actions"><button id="startWeak" class="minor">苦手問題だけ解く <span id="weakCount"></span></button><button id="clearWeak" class="minor">苦手の管理</button></div><button class="primary wide" id="start">演習を始める →</button></section>
<section id="catalog" class="card hidden"><div class="row"><button id="catalogBack">← 問題設定へ</button><span class="pill" id="catalogHeading"></span></div><p class="muted" id="catalogHelp"></p><div id="catalogBody"></div></section>
<section id="play" class="hidden"><div class="row navrow"><button id="back" class="minor">← 設定へ</button><span class="pill">2級・大問11</span><span id="score">正解 0問</span></div>
<div class="progress-track"><div class="progress-fill" id="bar"></div></div>
<div class="card question"><div class="row"><span id="number" class="eyebrow"></span><span id="tag" class="tag"></span></div><div class="row bookmark-row"><button id="bookmark" class="bookmark" aria-pressed="false">☆ 苦手に登録</button><span id="weakMeta" class="muted"></span></div><h2 id="stem"></h2><div class="choice-list" id="choices"></div>
<div id="feedback" class="feedback hidden" aria-live="polite"><div id="result" class="result"></div><div class="small-title">日本語訳</div><p id="translation"></p><div class="small-title">文法解説</div><p id="explanation"></p><div class="contrast"><div class="small-title">似た表現との違い・関連知識</div><p id="comparison"></p></div></div>
<div class="actions"><button id="check" class="primary" disabled>答え合わせ</button><button id="next" class="primary hidden">次の問題へ →</button></div>
</div></section>
<section id="summary" class="card hidden"><span class="eyebrow">RESULT</span><h2>演習結果</h2><div class="big-score" id="finalScore"></div><p id="finalMessage"></p><div class="row"><button id="retry" class="primary">もう一度解く</button><button id="toSetup">設定へ戻る</button></div><h3>間違えた問題</h3><p class="muted">間違えた問題は自動で苦手に登録されます。</p><div id="wrongList"></div></section>
</main></div>
<script>window.ACTIVE_LEVEL = GOIMONStorage.getItem("zensho_level_v1") || "1";</script>
<script src="learning_categories.js"></script>
<script src="learning_log.js"></script>
<script src="goimon_dialogues.js"></script>
<script src="goimon_dex.js"></script>
<script src="goimon_rules.js"></script>
<script src="goimon.js"></script>
<script src="g2q11_reward_recovery.js"></script>
<script src="g2q11_questions.js"></script><script src="g2q11.js"></script></body></html>
